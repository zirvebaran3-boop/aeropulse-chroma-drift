# release-ios şablonunun Capacitor uyarlaması: EAS yerine doğrudan xcodebuild.
# İmza: elle — Apple Distribution sertifikası (.p12) + "AeroPulse App Store GitHub" profili.
# (Bulut imza API anahtarında yetki istiyor; otomatik imza da kayıtlı cihaz istiyor.)
# Secret'lar: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, DIST_P12_BASE64, DIST_P12_PASSWORD, PROFILE_BASE64
# Yerel kopyalar: Desktop/Claude/release-ios/keys/aeropulse-dist/
# Çalıştırma: gh workflow run ios-testflight.yml --ref main
name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    # App Store, iOS 26 SDK (Xcode 26) ile derlenmiş build ister.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: WTC229UX5J
      PROFILE_NAME: AeroPulse App Store GitHub
      BUNDLE_ID: com.hredgamesstudio.aeropulse
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Repoda kaynak kod yok; hazır derlenmiş dist/ iOS projesine kopyalanır.
      - run: npx cap sync ios

      - name: İmza ve API anahtarı
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

          KC="$RUNNER_TEMP/build.keychain-db"; KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/aeropulse.mobileprovision

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M)"
          # İmza ayarları project.pbxproj'un App/Release yapılandırmasında; komut satırından
          # verilirse Capacitor paket hedeflerine de uygulanıp derlemeyi bozar.

      - name: TestFlight'a yükle
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
