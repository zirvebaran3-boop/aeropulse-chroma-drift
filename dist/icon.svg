<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10132b" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f2ff" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00f2ff" stroke-width="4" stroke-opacity="0.4" />

  <!-- Cyber Grid Lines -->
  <line x1="60" y1="180" x2="452" y2="180" stroke="#00f2ff" stroke-opacity="0.12" stroke-width="2" />
  <line x1="60" y1="256" x2="452" y2="256" stroke="#00f2ff" stroke-opacity="0.12" stroke-width="2" />
  <line x1="60" y1="332" x2="452" y2="332" stroke="#00f2ff" stroke-opacity="0.12" stroke-width="2" />
  <line x1="180" y1="60" x2="180" y2="452" stroke="#00f2ff" stroke-opacity="0.12" stroke-width="2" />
  <line x1="256" y1="60" x2="256" y2="452" stroke="#00f2ff" stroke-opacity="0.12" stroke-width="2" />
  <line x1="332" y1="60" x2="332" y2="452" stroke="#00f2ff" stroke-opacity="0.12" stroke-width="2" />

  <!-- Pulse Core Glow Rings -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00f2ff" stroke-opacity="0.25" stroke-dasharray="16 12" stroke-width="3" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ff0055" stroke-opacity="0.3" stroke-width="2" />

  <!-- Supersonic Aero Dart Ship -->
  <g filter="url(#glow)">
    <!-- Engine Thruster Trail -->
    <polygon points="170,256 120,248 100,256 120,264" fill="#00f2ff" fill-opacity="0.7" />
    <polygon points="190,256 140,250 120,256 140,262" fill="#ffffff" />

    <!-- Main Hull -->
    <polygon points="360,256 180,195 210,256 180,317" fill="url(#shipGrad)" stroke="#ffffff" stroke-width="4" />

    <!-- Wings / Energy Fins -->
    <polygon points="210,256 145,175 195,240" fill="#00f2ff" fill-opacity="0.8" />
    <polygon points="210,256 145,337 195,272" fill="#00f2ff" fill-opacity="0.8" />

    <!-- Core Cockpit Beacon -->
    <circle cx="260" cy="256" r="8" fill="#ffffff" />
  </g>

  <!-- Speed Graze Spark Accents -->
  <polygon points="380,210 395,200 405,215 390,225" fill="#ff0055" />
  <polygon points="370,300 390,290 400,305 380,315" fill="#f59e0b" />
</svg>
